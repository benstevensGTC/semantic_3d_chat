# V27 falsified fixed additive mixing: every nonzero fixed scale created two
# new mirrored-control failures.  V28 retains the calibrated all-voxel V26
# evidence as a separately pooled sidecar, restores V24's established scene
# tokens exactly, and installs a learned adapter only after V24's frozen
# global and signed-X scene stack.  Both adapter output routes initialize to
# exact zero, making the constructed candidate a bit-identical V24 no-op.
