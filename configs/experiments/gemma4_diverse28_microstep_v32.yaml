# Conditional optimizer repair for use only if V31's independent selector
# rejects every checkpoint.  V32 starts afresh from the same approved V29
# update_004 and uses the same exact 329,216-parameter trainable surface.  The
# data split, validation set, and deferred final scenes are unchanged.
training:
  output_namespace: gemma4_v32_diverse28_microstep
  v32_microstep:
    enabled: true
    optimizer_steps: 80
    checkpoint_interval_steps: 8
    broad_batch_size: 1
    pair_units_per_step: 1
    broad_exclude_expected_change: true
    broad_nll_weight: 1.0
    pair_language_nll_weight: 1.0
    pair_margin_weight: 4.0
    pair_margin: 0.5
    sidecar_learning_rate: 0.000025
    decoder_learning_rate: 0.00002
    weight_decay: 0.0
    gradient_clip_norm: 1.0
    minimum_answer_types: 4
    trainable_bank: extension_v30_joint_pair_query

