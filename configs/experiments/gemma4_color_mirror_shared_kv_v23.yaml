_base_: gemma4_color_mirror_signed_x_local_field_phase_aware_v21.yaml

# V21 reached the preregistered continuation floor while retaining the complete
# color control, but its scene-side residual could not resolve the final four
# mirrored sides. V23 changes exactly one trainable surface: the signed-X/global
# scene stack and both prior decoder banks are loaded from V21 epoch 8 and frozen,
# while one tiny zero-output bank adapts Gemma 4's two physical shared-K/V source
# layers. The complete 256-token scene prefix remains fixed and question-independent.
language:
  lora_banks:
    extension_v23_shared_kv:
      trainable: true
      rank: 4
      alpha: 8.0
      dropout: 0.0
      initialization_algorithm: cpu_kaiming_uniform_a_exact_zero_b
      initialization_seed: 23023
      expected_initial_state_sha256: 707defddb599baf670ab3fec6594d8f8ccccd6b31689393c1c7ca30abaeed59d
      target_modules:
        # Gemma 4's final decoder stack reuses sliding K/V from physical layer
        # 13 and full-attention K/V from physical layer 14. Later layers expose
        # no independent K/V projections, so these are the complete real path.
        - model.language_model.layers.13.self_attn.k_proj
        - model.language_model.layers.13.self_attn.v_proj
        - model.language_model.layers.14.self_attn.k_proj
        - model.language_model.layers.14.self_attn.v_proj

training:
  output_namespace: gemma4_v23_shared_kv
  extension_output_namespace: gemma4_v23_shared_kv_extension_u8
  initialize_from: data_gemma4/checkpoints/gemma4_v21_phase_aware_local_field_extension_u8/epoch_008
  initialize_expected_adapter_sha256: ce9e97061389a7eae5703593d0a8869f87bd12544f56f5976570965056b65f44
  initialize_expected_metadata_sha256: bbc8309d25db86e40fa01ec744e19b3c0fc1c61953ebfc5072f11c84bbd2e997
  initialize_expected_scene_state_sha256: 690bd890bfda024dbb5c7d3c68087b8113bc3b8ee81dd6143c7eb2a884e7245b
  initialize_expected_global_scene_residual_state_sha256: ce3bf864eed6dd4a50f1b67296981e144d6a79e9cf192ad9a9230f2ae18208dc
  initialize_expected_signed_x_scene_residual_state_sha256: e8dabc69627f60723b89520b02dfee985e49b7b7e35fdd1213cc79f7b8164f58
  initialize_legacy_lora_into_bank: null
  initialize_source_residual_into_frozen_base: false
  initialize_named_lora_freeze_transition: false
  train_signed_x_scene_residual_only: false
  train_global_scene_residual_only: false
  train_lora_with_frozen_scene_residual_stack: true
  freeze_scene_adapter: true

  # One complete 12-microstep paired accumulation is one optimizer update.
  # The single 3e-4 arm is deliberately below V15's destructive 2e-3 rate.
  epochs: 4
  pair_steps_per_epoch: 12
  gradient_accumulation: 12
  pair_gate_every_epochs: 1
  pair_gate_stop_when_passed: false
  early_stopping_patience: 0
  learning_rate: 0.0003
  lora_learning_rate: 0.0003
  lora_weight_decay: 0.0
  optimizer:
    learning_rate: 0.0003

# V21 evidence is immutable and cannot itself authorize V23. A V23-specific
# no-step preflight, mandatory update-one stop/verifier, and selector bind the
# source archive, new bank, optimizer surface, namespaces, and outcomes.
v21_screen: null

