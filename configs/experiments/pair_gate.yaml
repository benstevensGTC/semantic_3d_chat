_base_: multiscene_signal_v3.yaml

# Training-only wiring gate. The scene identifiers are opaque; complete
# changed-question units and their answers are read only by train_adapter.
training:
  output_namespace: pair_gate
  pair_only_mode: true
  pair_only_scene_ids:
    - scene_000003
    - scene_000004
    - scene_000007
    - scene_000008
  max_questions_per_scene: null
  learning_rate: 0.0005
  epochs: 30
  batch_size: 4
  gradient_accumulation: 4
  early_stopping_patience: 0

  # Every optimizer batch contains both prefixes for exact same-question units.
  pair_ranking_weight: 1.0
  pair_ranking_margin: 0.5
  pair_batch_fraction: 1.0
  pair_units_per_batch: 2
  pair_steps_per_epoch: 21

  # Candidate-ranked automated overfit gate. Free-generation and held-out
  # counterfactual metrics remain separate mandatory evaluation artifacts.
  pair_gate_enabled: true
  pair_gate_every_epochs: 1
  pair_gate_stop_when_passed: true
  pair_gate_changed_unit_accuracy: 0.95
  pair_gate_prediction_flip_rate: 1.0
  pair_gate_wrong_prefix_flip_rate: 1.0

  latent_diversity_weight: 0.05
  paired_scene_separation_weight: 1.0
