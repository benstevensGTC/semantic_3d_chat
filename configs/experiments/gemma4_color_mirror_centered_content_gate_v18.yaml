_base_: gemma4_color_mirror_global_scene_residual_v16.yaml

# V16/V17 showed that an unconstrained zero-output bridge spends roughly 99%
# of its first-step energy on one common shift across all 256 scene slots. V18
# is a new architecture screen, not another LR arm. It restarts from exact V14
# epoch 7 and hard-centers a content-gated learned delta across every slot in
# FP32 before the complete, question-independent prefix reaches Gemma.
scene_encoder:
  global_scene_residual:
    enabled: true
    architecture_version: zero_spatial_mean_content_gate_v1
    width: 128
    fourier_bands: 4
    initialization_seed: 18018
    gate_temperature: 1.0
    expected_initial_state_sha256: f7f6353edb6216029bd155e2baab1b5051c85f297a0e6d6b63210354fe0ff0e0

training:
  output_namespace: gemma4_color_mirror_centered_content_gate_v18
  initialize_from: data_gemma4/checkpoints/gemma4_color_mirror_decoder_banks_v14_lr2e3/epoch_007
  initialize_expected_adapter_sha256: 9e15e8c93da083bd23c009bf67cdf4d532d6beb01b12f17f8bf664e2374294c7
  initialize_expected_metadata_sha256: e4cf9134f5ef931df821820c80f96f1839fd2ae9a89b4c06ce4998db330e930e
  initialize_legacy_lora_into_bank: null
  initialize_named_lora_freeze_transition: true
  freeze_scene_adapter: true
  train_global_scene_residual_only: true

  epochs: 4
  pair_steps_per_epoch: 12
  gradient_accumulation: 12
  pair_gate_every_epochs: 1
  pair_gate_stop_when_passed: false
  early_stopping_patience: 0
  learning_rate: 0.001
  weight_decay: 0.0

  # These switches bind the real PyTorch optimizer to the isolated clone step;
  # omitting them could allow a platform-dependent foreach implementation.
  optimizer:
    name: AdamW
    learning_rate: 0.001
    betas: [0.9, 0.999]
    epsilon: 1.0e-8
    weight_decay: 0.0
    foreach: false
    fused: false
    capturable: false
    maximize: false
    amsgrad: false
    gradient_clip_norm: 1.0
    accumulation_divisor: 12
    step_index: 1

  latent_diversity_weight: 0.0
  paired_scene_separation_weight: 0.0
  grounding_weight: 0.0
  grounding_anchor_weight: 0.0
  spatial_answer_contrastive_weight: 0.0
  spatial_answer_warmup_steps: 0
  spatial_relation_contrastive_weight: 0.0
  spatial_relation_warmup_steps: 0

