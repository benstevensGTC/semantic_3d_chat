_base_: ../gemma4_e2b.yaml

# Small, decisive wiring gate for the unified Gemma 4 path. Both physical
# counterfactuals and both answers enter every unit; no scene metadata reaches
# the model. A checkpoint is accepted only when each prefix prefers its own
# changed answer under the identical question.
scene_encoder:
  coverage_temperature: 0.20
  coverage_scale: 16.0
  query_identity_scale: 0.05
  projection_skip_scale: 4.0

training:
  output_namespace: gemma4_pair_gate
  pair_only_mode: true
  pair_only_scene_ids:
    - scene_000003
    - scene_000004
    - scene_000007
    - scene_000008
  max_questions_per_scene: null
  learning_rate: 0.0002
  epochs: 12
  batch_size: 2
  gradient_accumulation: 1
  gradient_clip_norm: 1.0
  early_stopping_patience: 0

  # One unit means two scene prefixes per correct/swapped forward. This keeps
  # the frozen 5.1B-total Gemma checkpoint inside 24 GB unified memory.
  pair_ranking_weight: 8.0
  pair_ranking_margin: 0.5
  pair_batch_fraction: 1.0
  pair_units_per_batch: 1
  pair_steps_per_epoch: 41

  pair_gate_enabled: true
  pair_gate_every_epochs: 1
  pair_gate_stop_when_passed: true
  pair_gate_changed_unit_accuracy: 0.95
  pair_gate_prediction_flip_rate: 1.0
  pair_gate_wrong_prefix_flip_rate: 1.0

  # Isolate the language wiring gate; grounding is trained only after this
  # counterfactual criterion passes.
  grounding_weight: 0.0
  grounding_anchor_weight: 0.0
  latent_diversity_weight: 0.05
  latent_diversity_cosine_margin: 0.20
  latent_diversity_max_latents: 128
  paired_scene_separation_weight: 20.0
  paired_scene_cosine_distance_margin: 0.05
