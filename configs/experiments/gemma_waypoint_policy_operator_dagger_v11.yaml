_base_: gemma_waypoint_policy_operator_dagger_v10.yaml

# V11 preserves every V4--V10 lap correction and adds one training-only branch
# from the sealed V10 object-goal evaluation. The D1 FACE was directionally
# correct (-52.29 degrees versus the bounded teacher's -50 degrees), so the
# first semantic divergence is D2: Gemma selected MOVE_TO while the safe
# continuous-geometry expert required another FACE. Runtime still has no
# planner, target lookup, oracle coordinates, route, fallback, or STOP gate.
gemma_waypoint_traces:
  history_parameterization: selected_action_parameters_goal_progress_v2
  history_feature_dim: 16
  profiles:
    operator:
      live_object_goal_dagger_augmentation:
        enabled: true
        runtime_report_path: reports/gemma4/metrics/gemma_waypoint_dagger_v10_approach_chair_runtime.json
