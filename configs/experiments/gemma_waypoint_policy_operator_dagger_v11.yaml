        score_report_sha256: 51b6ebd72849343094b39f33377a8d9a705223c7f49d5a3ee42b3a06e550b3d7
        scene_id: scene_000001
        goal_id: approach_chair
        instruction: Move close to the chair, then stop.
        initial_pose_xy_yaw: [-0.5, -0.25, -90.0]
        checkpoint_sha256: cee930ef97c30747505ece026399042014a4ae7f43e8c29e3d19f5755b69b4f9
        scene_prefix_sha256: 52c33298140845d341fa2b4568f2c6e960279495890e08455caafa7d5bbc9c95
