gemma_waypoint_policy:
  trace_dataset: data_gemma4/training/gemma_waypoint_policy_v2_operator_dagger_v11
  hidden_cache: data_gemma4/training/gemma_waypoint_policy_v2_operator_dagger_v11_runtime_aligned_hidden
  checkpoint_output: data_gemma4/checkpoints/gemma_waypoint_policy_v2_operator_dagger_v11_runtime_aligned
  history_dim: 16
  history_parameterization: selected_action_parameters_goal_progress_v2
