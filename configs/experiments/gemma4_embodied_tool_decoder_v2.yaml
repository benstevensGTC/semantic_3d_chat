_base_: navigation_policy_v3.yaml

# Corrected true causal Gemma-4 tool adapter. V1 selected checkpoint K/V
# tensors that Transformers intentionally omits on KV-sharing layers. V2 uses
# the real final-layer MLP down projection and remains blocked from long
# training until every sealed launch gate below passes.
language:
  lora_banks:
    embodied_tool_decoder_v2_final_down:
      trainable: true
      rank: 4
      alpha: 8.0
      dropout: 0.0
      initialization_algorithm: cpu_kaiming_uniform_a_exact_zero_b
      initialization_seed: 2026081218
      expected_initial_state_sha256: 58b12ef8f2b5c9ffdf1a99d068b32b5414cefe50236013ebbedc831382114a13
      target_modules:
        - model.language_model.layers.34.mlp.down_proj

training:
  output_namespace: gemma4_embodied_tool_decoder_v2
  lora_learning_rate: 0.0001
  lora_weight_decay: 0.0
  decoder_gradient_checkpointing: true

gemma4_embodied_tool_decoder_v2:
