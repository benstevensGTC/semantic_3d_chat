_base_: ../runtime/embodied_v54.yaml

# Distinct successor to V1/V2. V3 consumes a numeric target grounded at runtime
# by comparing the user target's local-Gemma vector with every active 3D voxel.
# Oracle coordinates exist only in the blocked training-tree trace artifact.
navigation_policy_v3:
  train_scene_ids:
    - scene_000011
    - scene_000012
    - scene_000013
    - scene_000014
    - scene_000015
    - scene_000016
    - scene_000017
    - scene_000018
    - scene_000019
    - scene_000020
    - scene_000021
    - scene_000022
    - scene_000023
    - scene_000024
  validation_scene_ids:
    - scene_000031
    - scene_000032
    - scene_000033
    - scene_000034
    - scene_000035
    - scene_000036
    - scene_000037
    - scene_000039
  oracle_root: data/oracle
  source_trace_dataset: data_gemma4/training/navigation_policy_v2
  trace_output: data_gemma4/training/navigation_policy_v3
  prefix_cache_root: data_gemma4/scene_tokens/v56_question_control_full_prefixes
  checkpoint_output: data_gemma4/checkpoints/navigation_policy_v3
  robot_state_checkpoint: data_gemma4/checkpoints/robot_state_numeric_v1
  scene_token_count: 258
  robot_token_count: 4
  hidden_size: 1536
  model_dim: 128
  batch_size: 32
  epochs: 60
  learning_rate: 0.0005
  weight_decay: 0.0001
  argument_loss_weight: 0.5
  turn_sign_loss_weight: 0.25
  zero_target_stop_loss_weight: 0.30
  target_change_loss_weight: 0.05
  target_change_margin: 0.10
  gradient_clip_norm: 1.0
  early_stopping_patience: 12
  # V1/V2 behavioral gates are preserved exactly; V3 adds target-causal gates.
  minimum_validation_action_accuracy: 0.60
  minimum_validation_stop_recall: 0.80
  minimum_validation_turn_sign_accuracy: 0.70
  maximum_validation_argument_mae: 0.35
  minimum_zero_target_targeted_accuracy_drop: 0.10
  minimum_wrong_target_turn_sign_drop: 0.02
  seed: 20260812
  device: cpu
