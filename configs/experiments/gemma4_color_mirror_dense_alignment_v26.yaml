_base_: gemma4_color_mirror_dense_alignment_v25.yaml

# V25 exposed a scientific split error: its semantic warm-up included the
# final QA test pair (scenes 5/6), even though paired-QA itself never launched.
# V26 restarts from the same immutable V24 epoch-1 checkpoint and exact-zero
# rank-eight bridge.  Calibration gradients are restricted to scenes 1/2/9/10;
# mirrored scenes 7/8 are semantic validation only; scenes 3/4 and the final
# QA test pair 5/6 are fail-closed forbidden to both calibration loaders.
training:
  output_namespace: gemma4_v26_dense_alignment
  extension_output_namespace: gemma4_v26_dense_alignment_extension_u8

  dense_alignment_warmup:
    enabled: true
    training_only: true
    max_optimizer_steps: 40
    evaluation_interval_steps: 1
    learning_rate: 0.005
    weight_decay: 0.0001
    delta_rms_cap: 1.0
    delta_abs_max_cap: 3.5
    delta_rms_regularization_weight: 0.01
    early_stop_top1_accuracy: 1.0
    early_stop_minimum_margin: 0.10
    held_out_scene_gradient_access: false
    reset_pair_optimizer_after_warmup: true

  dense_alignment_supervision:
    calibration_scene_ids:
      - scene_000001
      - scene_000002
      - scene_000009
      - scene_000010
    held_out_scene_ids:
      - scene_000007
      - scene_000008

# Exactly one calibration profile may be active.  The V25 profile remains
# immutable for historical replay; V26 is a separate, explicitly pinned arm.
v25_screen: null

v26_screen:
  schema_version: 1
  role: final_qa_test_isolated_dense_alignment_screen
  primary_output_namespace: gemma4_v26_dense_alignment
  extension_output_namespace: gemma4_v26_dense_alignment_extension_u8
  source_checkpoint_epoch: 1
  source_archive_summary_sha256: 287328190cc2f9e3ff771fa9d9f08f7186c75c9cb22b3eadad3bd002e55b9eb3
  source_failure_localization_sha256:
    scene_000007: cdaaba41b37f6dbe9df0083e35a5b8c03a106aa9a83b1a549840e4baa3fe96f8
    scene_000008: 2e68ce27e5f50983b57e0519d04e50c51d050efcb81f27767ebd8d3e941eeb8a

  preregistered_screen_report: reports/gemma4/metrics/v26_dense_alignment_calibration_screen.json
  preregistered_screen_report_sha256: dfac0479f7bc4744de0ae49b2dd9cbcb0695279cb85abd03245dcbb3cb800d54
  selected_arm_index: 1
  selected_initial_state_sha256: bdff604538cfc82ba16ce5a701a573a4a64de486791c6e4ae7c4d5faba094874
  selected_final_state_sha256: 5c8721fd1ff789b7a8a55e82f31fd7faae54b8114616d3a29efd8605190bad6e
  selected_history_sha256: 8d5f1144596938c30c94cb6d08866d4e68649685dbaa134068a042838d7b762e
  selected_held_out_localization_sha256: ac64416615d2149feb1e0920dc72ff586a1a3337bccbbfda145cd8384623d5c2
  selected_optimizer:
    name: AdamW
    learning_rate: 0.005
    weight_decay: 0.0001
    delta_mse_regularization_weight: 0.01
    maximum_optimizer_steps: 40
    stop_at_first_passing_evaluation: true

  qa_split_manifest: data/qa/splits.json
  qa_split_manifest_sha256: 075a871ad00ca322745159c52d919809bab8d819afb2bb77ac207eb3e5cb7f0c
  final_qa_test_scene_ids:
    - scene_000005
    - scene_000006
  forbidden_calibration_scene_ids:
    - scene_000003
    - scene_000004
    - scene_000005
    - scene_000006

  screen_optimizer_updates: 4
  conditional_max_optimizer_updates: 8
  stage_1_optimizer_updates: 1
  stage_1_stop_required: true
  held_out_localization_requires:
    scene_count: 2
    target_region_count: 4
    all_target_hit_at_k: true
    minimum_precision_at_k: 0.10
    positive_correct_vs_distractor_margin: true
    positive_region_margin: true
    maximum_mirror_centroid_error_m: 0.15
  stage_2_requires:
    color_full_vocab_sides: 12
    color_full_vocab_units: 6
    color_positive_minimum_candidate_margin: true
    color_positive_minimum_full_vocab_margin: true
    mirror_minimum_full_vocab_sides: 10
    mirror_minimum_full_vocab_units: 4
    source_negative_side_count: 2
    both_source_negative_margins_strictly_improve: true
    no_new_negative_mirror_sides: true
  eligibility_requires:
    color_full_vocab_sides: 12
    color_full_vocab_units: 6
    color_positive_minimum_candidate_margin: true
    color_positive_minimum_full_vocab_margin: true
  continuation_requires:
    mirror_minimum_full_vocab_sides: 10
    mirror_minimum_full_vocab_units: 4
  full_teacher_gate_requires:
    color_full_vocab_sides: 12
    color_full_vocab_units: 6
    mirror_full_vocab_sides: 12
    mirror_full_vocab_units: 6
    all_candidate_and_full_vocab_minimum_margins_positive: true
  greedy_audit_only_after_full_teacher_gate: true

experiment:
  role: final_qa_test_isolated_dense_alignment_falsifier_v26
