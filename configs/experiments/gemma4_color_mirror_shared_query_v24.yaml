# V23's shared-K/V bank reached 10/12 mirrored sides but did not pass the
# complete teacher-forced gate. V24 preserves that selected epoch-2 state as
# immutable context and changes exactly one trainable surface: a zero-output
# query-only bank on the two physical attention layers immediately preceding
# the previously explored late decoder stack. The complete 256-token scene
# prefix remains fixed, global, and question-independent.
language:
  lora_banks:
    extension_v23_shared_kv:
      trainable: false
      initialization_algorithm: checkpoint_overwrite
      initialization_seed: null
      expected_initial_state_sha256: 91a9eea577cab5a37e840cdf4007722a398415846af91280713bcb2cda0f045c
    extension_v24_shared_query:
      trainable: true
      rank: 4
      alpha: 8.0
      dropout: 0.0
      initialization_algorithm: cpu_kaiming_uniform_a_exact_zero_b
      initialization_seed: 24024
      expected_initial_state_sha256: e8734db171db6bd47a9a4f8c9d4a540903cc214a88abaab74820d566ee245f6b
      target_modules:
        - model.language_model.layers.28.self_attn.q_proj
        - model.language_model.layers.29.self_attn.q_proj

