_base_: gemma4_diverse20_post_stack_decoder_stage_b_v29.yaml

# V30 is a separate, bounded repair experiment for V29's observed
# counterfactual invariance.  It starts only from the selector-approved V29
# update, keeps every inherited tensor frozen except the two already-audited
# post-stack sidecar output surfaces, and adds one disjoint exact-zero decoder
# bank.  Training metadata/QA remain evaluation-only; chat runtime receives
# only the continuous map and learned parameters.
language:
  lora_banks:
    extension_v28_stage_b_query:
      trainable: false
      rank: 4
      alpha: 8.0
      dropout: 0.0
      target_modules:
        - model.language_model.layers.13.self_attn.q_proj
        - model.language_model.layers.14.self_attn.q_proj
      initialization_algorithm: checkpoint_overwrite
      initialization_seed: null
      expected_initial_state_sha256: cc9dfa838bb87f32e2922d675658af4a1085d53a84ccdca6d5bacc6f7097217b
    extension_v30_joint_pair_query:
      trainable: true
      rank: 8
      alpha: 16.0
      dropout: 0.0
      target_modules:
        - model.language_model.layers.18.self_attn.q_proj
        - model.language_model.layers.19.self_attn.q_proj
        - model.language_model.layers.20.self_attn.q_proj
        - model.language_model.layers.21.self_attn.q_proj
      initialization_algorithm: cpu_kaiming_uniform_a_exact_zero_b
      initialization_seed: 30030
      expected_initial_state_sha256: 2b1d89fbb9189ac551bf12905cf94036ebaa84696449b31c2b37b69d478fb70d

