      change_type: mirror_lr
      pair_role: counterfactual

qa:
  # Generic balanced selection cannot promise exact global answer-type totals.
  # It therefore emits the full deterministic candidate pool; the separately
  # gated V95 exact-quota selector performs the create-once final projection.
  balanced_selection:
    enabled: false
  v95_exact_final_selection:
    schema_version: 1
    seed: 950095
    rows_per_scene: 36
    changed_units_per_pair: 4
    pair_unit_quotas:
      attribute: 8
      count: 7
      metric: 1
      orientation: 1
      presence: 7
      spatial_relation: 8
      support: 4
    answer_type_totals:
      attribute: 48
      count: 42
      metric: 6
      orientation: 6
      presence: 42
      spatial_relation: 48
      support: 24
