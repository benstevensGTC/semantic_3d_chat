  # post-rejection continuations, and selected-action-only history encoding.
  trace_dataset: data_gemma4/training/gemma_waypoint_policy_v1_operator_dagger_v4
  prefix_cache_root: data_gemma4/scene_tokens/gemma_waypoint_policy_v1_live
  hidden_cache: data_gemma4/training/gemma_waypoint_policy_v1_operator_dagger_v4_runtime_aligned_hidden
  checkpoint_output: data_gemma4/checkpoints/gemma_waypoint_policy_v1_operator_dagger_v4_runtime_aligned
  runtime_aligned_control_config: configs/runtime/gemma4_v56_question_control.yaml
