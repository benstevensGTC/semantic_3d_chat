# V9 changes the runtime-aligned numeric history contract. Every trace is
# regenerated from exact numeric action receipts with the shared goal-scoped
# progress ledger; no V1 hidden state may be reused. The four appended values
# expose accepted path length, signed swept area, return distance, and the
# rejection streak. They select no waypoint, heading, route, recovery, or STOP.
