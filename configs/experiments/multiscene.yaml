_base_: ../default.yaml

training:
  # Isolate this generalization run from data/checkpoints/best and the
  # single-scene reports/metrics/training.json artifact.
  output_namespace: multiscene
  max_questions_per_scene: 48
  learning_rate: 0.0003
  epochs: 5
  batch_size: 4
  gradient_accumulation: 1
  early_stopping_patience: 3

# This plan is oracle-side generation metadata. Blender and render_scan receive
# base_config so scene_000001 keeps the exact original config and deterministic
# oracle/preview/runtime bytes; the batch cache leaves its Blender binary untouched.
batch:
  base_config: configs/default.yaml
  expected_scene_count: 10
  seed_stride: 1009
  scenes:
    scene_000001:
      seed_offset: 0
      color_variant: base
      layout_variant: base
      remove_instance_ids: []
    scene_000002:
      seed_offset: 1009
      color_variant: base
      layout_variant: base
      remove_instance_ids: []
    scene_000003:
      seed_offset: 2018
      color_variant: base
      layout_variant: base
      remove_instance_ids: []
      pair_id: pair_000001
      paired_scene_id: scene_000004
      change_type: color_swap
      pair_role: reference
    scene_000004:
      seed_offset: 2018
      color_variant: swap_red_blue
      layout_variant: base
      remove_instance_ids: []
      pair_id: pair_000001
      paired_scene_id: scene_000003
      change_type: color_swap
      pair_role: counterfactual
    scene_000005:
      seed_offset: 3027
      color_variant: base
      layout_variant: cube_on
      remove_instance_ids: []
      pair_id: pair_000002
      paired_scene_id: scene_000006
