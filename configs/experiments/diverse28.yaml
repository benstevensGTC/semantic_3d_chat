_base_: diverse20.yaml

# Development-only expansion of diverse20.  The inherited validation scenes
# (19--24) and deferred final-test scenes (25--30) are deliberately unchanged.
# Only the eight new training scenes (31--38) are added here.
paths:
  # RGB-D/oracle artifacts remain under data and Gemma maps remain under
  # data_gemma4 through the inherited gemma4_e2b configuration.  Only QA is
  # isolated so this expansion cannot overwrite the diverse20 dataset.
  qa_root: data_diverse28/qa

training:
  output_namespace: gemma4_diverse28

batch:
  manifest_name: diverse28
  expected_scene_count: 28
  expected_split_counts:
    train: 16
    validation: 6
    test: 6
  # Exact depth-ray visibility is mandatory before QA generation.
  require_visibility_evidence: true
  splits:
    train:
      - scene_000011
      - scene_000012
      - scene_000013
      - scene_000014
      - scene_000015
      - scene_000016
      - scene_000017
      - scene_000018
      - scene_000031
      - scene_000032
      - scene_000033
      - scene_000034
      - scene_000035
      - scene_000036
      - scene_000037
      - scene_000038
    validation:
      - scene_000019
      - scene_000020
      - scene_000021
      - scene_000022
      - scene_000023
      - scene_000024
    test:
      - scene_000025
      - scene_000026
      - scene_000027
      - scene_000028
      - scene_000029
      - scene_000030
  scenes:
    # TRAIN EXPANSION: four new atomic pairs / eight scenes.  Each pair shares
    # one new seed and differs in exactly its declared physical fact.
    scene_000031:
      plan_version: 2
      seed_offset: 16144
      color_variant: swap_red_blue
      layout_variant: mirror_wide
      picture_placement: wall
      bowl_placement: floor_right
      book_placement: table
      pair_id: pair_000015
      paired_scene_id: scene_000032
      change_type: book_support
      pair_role: reference
    scene_000032:
      plan_version: 2
      seed_offset: 16144
      color_variant: swap_red_blue
      layout_variant: mirror_wide
      picture_placement: wall
      bowl_placement: floor_right
      book_placement: under_table
      pair_id: pair_000015
      paired_scene_id: scene_000031
      change_type: book_support
      pair_role: counterfactual

    scene_000033:
      plan_version: 2
      seed_offset: 17153
      color_variant: rotate_primary
      layout_variant: wide
      picture_placement: wall
      bowl_placement: floor_left
      book_placement: under_table
      pair_id: pair_000016
      paired_scene_id: scene_000034
