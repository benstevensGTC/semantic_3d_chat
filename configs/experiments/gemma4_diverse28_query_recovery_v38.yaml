# V38 is a bounded query-readout recovery experiment. It starts from a
# deterministic K-only hybrid: V37 update 16 supplies both learned K adapters,
# while the two V adapters are rolled back bit-exactly to V36 update 16. Only
# the already-learned V30 query bank is continued. The hybrid V23 bank, learned
# V36 block core, complete continuous scene stack, Gemma base, and every other
# LoRA bank remain frozen.
