_base_: gemma4_color_wiring_v9.yaml

# Stage the proven color-prefix bridge into a second physical intervention.
# Initialization is weights-only: optimizer state and v9 history are not
# reused, and the source checkpoint/hash is recorded in every v10 checkpoint.
# A seed-hashed cap selects six complete units from each pair without inspecting
# question text or answers; both physical scene sides remain indivisible.
training:
  output_namespace: gemma4_color_mirror_wiring_v10
  initialize_from: data_gemma4/checkpoints/gemma4_color_wiring_v9/epoch_036
  pair_only_scene_ids:
    - scene_000003
    - scene_000004
    - scene_000007
    - scene_000008
  pair_max_units_per_pair: 6
  max_questions_per_scene: 6
  pair_steps_per_epoch: 12
  gradient_accumulation: 12
  epochs: 12
  pair_gate_every_epochs: 2
  pair_gate_stop_when_passed: false
  pair_ranking_margin: 1.0
  # The inherited color warmup aligns one object token with one attribute
  # word. That objective is invalid for left/right, which depends on both the
  # target and reference objects; rely on the paired LM distribution here.
  spatial_answer_contrastive_weight: 0.0
  spatial_answer_warmup_steps: 0
