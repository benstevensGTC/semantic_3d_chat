_base_: gemma4_color_mirror_global_scene_residual_v16.yaml

# V16's zero-output bridge was structurally correct, but its first AdamW update
# moved only the 196,608 output-projection weights by almost exactly 1e-3.  The
# resulting residual was about 13.4% of the frozen prefix RMS, was dominated by
# an across-slot common shift, and erased the pinned V14 color result before the
# inner content/position projections could receive gradients.  V17 therefore
# changes optimizer response only.  Both arms restart from the same exact V14
# epoch-7 checkpoint and the same bit-identical zero residual; neither inherits
# V16 weights, optimizer moments, or history.
training:
  output_namespace: gemma4_color_mirror_global_scene_residual_v17_lr_sweep_template
  epochs: 4
  pair_steps_per_epoch: 12
  gradient_accumulation: 12
  pair_gate_every_epochs: 1
  pair_gate_stop_when_passed: false
  early_stopping_patience: 0

# Clear the historical V14 decoder-LR metadata inherited through V16; this is a
# distinct residual-optimizer experiment with its own contract below.
sweep: null

lr_response:
  schema_version: 1
  role: exact_restart_global_scene_residual_learning_rate_response
  arms:
    - 0.0001
    - 0.0003
  updates_per_arm: 4
  conditional_max_updates: 12
  color_pair_id: pair_000001
  mirror_pair_id: pair_000003
