  initialize_legacy_lora_into_bank: null
  initialize_source_residual_into_frozen_base: false
  initialize_named_lora_freeze_transition: false
  initialize_named_lora_freeze_and_extend_transition: false
  initialize_named_lora_freeze_for_dense_alignment_transition: true
  train_signed_x_scene_residual_only: false
  train_global_scene_residual_only: false
  train_lora_with_frozen_scene_residual_stack: false
  train_dense_alignment_only: true
  freeze_scene_adapter: true

  # A bounded, training-only semantic warm-up runs before paired QA. It may
  # inspect oracle boxes only for the eight calibration scenes and cannot use
  # scenes 7/8 for gradients. The paired QA optimizer is then rebuilt from
  # empty state and retains V24's exact 12-microstep update definition.
  epochs: 4
  pair_steps_per_epoch: 12
  gradient_accumulation: 12
  pair_gate_every_epochs: 1
  pair_gate_stop_when_passed: false
  early_stopping_patience: 0
  learning_rate: 0.0003
  dense_alignment_learning_rate: 0.0003
  dense_alignment_weight_decay: 0.0
  optimizer:
    name: AdamW
    learning_rate: 0.0003
    weight_decay: 0.0
    accumulation_divisor: 12
    step_index: 1

  dense_alignment_warmup:
    enabled: true
    training_only: true
    max_optimizer_steps: 20
    evaluation_interval_steps: 1
    learning_rate: 0.01
    weight_decay: 0.0001
    delta_rms_cap: 1.0
    delta_abs_max_cap: 3.5
    delta_rms_regularization_weight: 0.01
    early_stop_top1_accuracy: 1.0
    early_stop_minimum_margin: 0.10
    held_out_scene_gradient_access: false
    reset_pair_optimizer_after_warmup: true

  dense_alignment_supervision:
    enabled: true
    training_only: true
    oracle_access_process: training_and_evaluation_only
    runtime_oracle_access: false
    runtime_serializes_category_strings: false
    runtime_serializes_text_embeddings: false
    question_dependent_scene_processing: false
    all_voxels_transformed: true
    calibration_scene_ids:
      - scene_000001
      - scene_000002
      - scene_000003
      - scene_000004
      - scene_000005
      - scene_000006
      - scene_000009
      - scene_000010
    held_out_scene_ids:
      - scene_000007
      - scene_000008
    dense_dim: 1536
    aligned_start: 1536
    aligned_dim: 1536
    temperature: 0.07
    bbox_padding_m: 0.0375
    minimum_voxels_per_region: 8
    loss_weight: 1.0

# V24 evidence cannot authorize V25. A V25-specific no-step preflight binds
