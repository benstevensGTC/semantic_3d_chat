_base_: gemma4_color_mirror_shared_query_v24.yaml

# V24 preserved the complete color control and reached 10/12 mirrored sides,
# but the same two bowl-related sides remained negative through update eight.
# Evaluation-only localization then showed that bowl and cabinet were not
# aligned with Gemma token embeddings even though training-only oracle-box
# prototypes classified the raw dense features nearly perfectly. V25 changes
# exactly one upstream surface: a zero-output, voxel-local rank-eight residual
# from the stored 1,536D middle+late feature stream into the existing 1,536D
# aligned tail. It is applied to every voxel before the complete, fixed scene
# prefix is built and accepts no question or environmental metadata at runtime.
scene_encoder:
  dense_alignment:
    enabled: true
    dense_dim: 1536
    aligned_dim: 1536
    rank: 8
    alpha: 16.0
    initialization_seed: 25025
    expected_initial_state_sha256: bdff604538cfc82ba16ce5a701a573a4a64de486791c6e4ae7c4d5faba094874

language:
  lora_banks:
    inherited_v12:
      trainable: false
    extension_v13:
      trainable: false
    extension_v23_shared_kv:
      trainable: false
    extension_v24_shared_query:
      trainable: false
      initialization_algorithm: checkpoint_overwrite
      initialization_seed: null
      expected_initial_state_sha256: 6db2807476506b947bbaf01837490e97c12e57b1906bab671ef7c82ed36d6399

training:
  output_namespace: gemma4_v25_dense_alignment
  extension_output_namespace: gemma4_v25_dense_alignment_extension_u8
