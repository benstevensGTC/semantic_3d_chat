[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "semantic-3d-chat"
version = "0.1.0"
description = "Continuous 3D scene-memory research prototype for local language models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "huggingface-hub>=0.30,<1",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "pillow>=10.4,<12",
  "psutil>=6,<8",
  "pyyaml>=6,<7",
  "safetensors>=0.5,<1",
  "scikit-learn>=1.5,<2",
  "starlette>=0.46,<2",
  "torch>=2.6,<3",
  "transformers>=4.50,<5",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
mcp = ["mcp[cli]==2.0.0"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
semantic-3d-chat = "semantic_3d_chat.chat.cli:main"
semantic-3d-web = "semantic_3d_chat.chat.web_app:main"
semantic-3d-robot = "semantic_3d_chat.robot.agent_loop:app"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_3d_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
